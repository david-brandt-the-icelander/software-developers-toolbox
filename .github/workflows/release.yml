# Build universal macOS binaries, sign and notarize them, and publish them to a GitHub release and to icelander.net/downloads on version tags.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --workspace --locked
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --workspace --release --locked --target "$t"
          done
      - name: Make universal binaries
        run: |
          mkdir -p dist
          for bin in afs fix-network free-disk-space; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
      # Developer ID signature and Apple notarization, so Gatekeeper opens the binaries
      # (macos/release/README.md). Required on version tags; manual runs without secrets stay unsigned.
      - name: Sign and notarize
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ../release/sign-and-notarize.sh dist afs fix-network free-disk-space
      - name: Package
        run: |
          tar -C dist -czf toolbox-macos-universal.tar.gz afs fix-network free-disk-space
          shasum -a 256 toolbox-macos-universal.tar.gz > toolbox-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-macos-universal
          path: |
            macos/rust/toolbox-macos-universal.tar.gz
            macos/rust/toolbox-macos-universal.tar.gz.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          toolbox-macos-universal.tar.gz toolbox-macos-universal.tar.gz.sha256
      - name: Publish to icelander.net
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab026008f5aa2bef2dca4cfccd0f70ef
        run: |
          for dir in "$GITHUB_REF_NAME" latest; do
            npx --yes wrangler@4 r2 object put "icelander-downloads/toolbox/$dir/toolbox-macos-universal.tar.gz" \
              --file toolbox-macos-universal.tar.gz --content-type application/gzip --remote
            npx --yes wrangler@4 r2 object put "icelander-downloads/toolbox/$dir/toolbox-macos-universal.tar.gz.sha256" \
              --file toolbox-macos-universal.tar.gz.sha256 --content-type "text/plain; charset=utf-8" --remote
          done
