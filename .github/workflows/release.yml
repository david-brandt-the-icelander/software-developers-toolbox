# Build universal macOS binaries, publish them to a GitHub release on version tags, and upload them to icelander.net/apps.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: macos/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --workspace --locked
      - name: Build both architectures
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --workspace --release --locked --target "$t"
          done
      - name: Package universal binaries
        run: |
          mkdir -p dist
          for bin in fix-network free-disk-space; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          tar -C dist -czf toolbox-macos-universal.tar.gz fix-network free-disk-space
          shasum -a 256 toolbox-macos-universal.tar.gz > toolbox-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: toolbox-macos-universal
          path: |
            macos/rust/toolbox-macos-universal.tar.gz
            macos/rust/toolbox-macos-universal.tar.gz.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --generate-notes
          toolbox-macos-universal.tar.gz toolbox-macos-universal.tar.gz.sha256

  # Upload the tagged build to icelander.net's download bucket, where /apps/ links to it
  # (icelander.net docs/deploying.md, "Letting a release workflow upload"). Needs the secret
  # CLOUDFLARE_R2_TOKEN: an API token with only "Workers R2 Storage: Edit" on icelander-downloads.
  icelander-net:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ab026008f5aa2bef2dca4cfccd0f70ef
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: toolbox-macos-universal
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upload to toolbox/<tag>/, then toolbox/latest/
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::secret CLOUDFLARE_R2_TOKEN is not set"; exit 1; }
          sha256sum -c toolbox-macos-universal.tar.gz.sha256
          for dir in "$GITHUB_REF_NAME" latest; do
            npx --yes wrangler@4.156.1 r2 object put "icelander-downloads/toolbox/$dir/toolbox-macos-universal.tar.gz" \
              --file toolbox-macos-universal.tar.gz --content-type application/gzip --remote
            npx --yes wrangler@4.156.1 r2 object put "icelander-downloads/toolbox/$dir/toolbox-macos-universal.tar.gz.sha256" \
              --file toolbox-macos-universal.tar.gz.sha256 --content-type "text/plain; charset=utf-8" --remote
          done
