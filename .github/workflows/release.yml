# First publish an alpha (vX.Y.Z-alpha.N: a quick macOS build without the tests and the PGO profile, as a GitHub
# pre-release, icelander.net zazzle/alpha and the zazzle-alpha formula), then the release itself.
# Build universal macOS binaries (signed when configured), Linux tarballs and the language modules and JIT tools (ai-agent) daemon downloads; publish them to a GitHub release (no release notes), icelander.net/downloads and the zazzcat/homebrew-z tap. The version comes from the tag: a pushed vX.Y.Z tag, or, when run by hand, the exact version given or the next one after the latest tag for a bump (release/version.sh); every binary is built with it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Release the next version after the latest v* tag (patch, minor, major), or only build (none)"
        type: choice
        options: [patch, minor, major, none]
        default: patch
      version:
        description: "Release exactly this version (X.Y.Z, a tag that does not exist yet) instead of the bump; leave empty to bump"
        type: string
        default: ""
      channel:
        description: "both: publish an alpha first, then the release; alpha: only the alpha (the version may already be released)"
        type: choice
        options: [both, alpha]
        default: both

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      alpha_tag: ${{ steps.v.outputs.alpha_tag }}
      alpha_version: ${{ steps.v.outputs.alpha_version }}
      stable: ${{ steps.v.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          EXACT_VERSION: ${{ inputs.version }}
        run: bash release/version.sh "${{ github.ref_type }}" "$GITHUB_REF_NAME" "${{ inputs.bump || 'none' }}" "$EXACT_VERSION" "${{ inputs.channel || 'both' }}" >> "$GITHUB_OUTPUT"
      # A tag pushed with GITHUB_TOKEN starts no other workflow, so this run goes on to publish it.
      - name: Tag the release
        if: github.ref_type != 'tag' && steps.v.outputs.publish == 'true'
        run: |
          git tag "${{ steps.v.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.v.outputs.tag }}"

  # The alpha channel: the same commit built quickly (no tests, no PGO profile) and published before the release jobs
  # start, so the alpha can be installed and tried while the release is still building (brew install zazzle-alpha).
  alpha:
    needs: version
    if: needs.version.outputs.alpha_tag != ''
    runs-on: macos-latest
    env:
      TAG: ${{ needs.version.outputs.alpha_tag }}
      VERSION: ${{ needs.version.outputs.alpha_version }}
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
          key: release-alpha
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Stamp the version
        working-directory: .
        run: bash release/set-version.sh "$VERSION"
      - name: Build, sign and list the language modules
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bash ../../release/language-modules.sh dist/languages aarch64-apple-darwin x86_64-apple-darwin
          (cd dist/languages && ../../../../release/sign-and-notarize.sh . ./*.dylib)
          bash ../../release/language-modules.sh --manifest dist/languages
      - name: Build, sign and list the JIT tools
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bash ../../release/tools.sh dist/tools aarch64-apple-darwin x86_64-apple-darwin
          (cd dist/tools && ../../../../release/sign-and-notarize.sh . ai-agent)
          bash ../../release/tools.sh --manifest dist/tools
      - name: Build universal binaries
        env:
          ZAZZLE_LANGUAGES_MANIFEST: ${{ github.workspace }}/src/macos/dist/languages/manifest
          ZAZZLE_TOOLS_MANIFEST: ${{ github.workspace }}/src/macos/dist/tools/manifest
        run: |
          bins="daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --workspace --exclude ai-agent --release --locked --target "$t"
          done
          for b in $bins; do
            lipo -create -output "dist/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          make -C zazzle
          cp zazzle/build/zazzle dist/zazzle
      - name: Build the C# indexer for both CPU types
        working-directory: src/macos/csharp-indexer
        run: |
          for pair in arm64:osx-arm64 x64:osx-x64; do
            dotnet publish src -c Release -r "${pair#*:}" -o "out/${pair#*:}" -p:Version="$VERSION"
            gzip -9 -n -c "out/${pair#*:}/csharp-indexer" > "$GITHUB_WORKSPACE/src/macos/dist/csharp-indexer-${pair%%:*}.gz"
          done
      - name: Add cyberspace-generator
        run: |
          bash ../../release/fetch-cyberspace-generator.sh cg aarch64-apple-darwin x86_64-apple-darwin
          lipo -create -output dist/cyberspace-generator cg/cyberspace-generator-aarch64-apple-darwin cg/cyberspace-generator-x86_64-apple-darwin
      - name: Sign and notarize
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ../../release/sign-and-notarize.sh dist zazzle daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor cyberspace-generator
      - name: Package
        run: |
          ./dist/daemon --version
          bash ../../release/pack.sh dist zazzle-macos-universal.tar.gz zazzle daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor cyberspace-generator csharp-indexer-arm64.gz csharp-indexer-x64.gz
          shasum -a 256 zazzle-macos-universal.tar.gz > zazzle-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: zazzle-alpha-macos-universal
          path: |
            src/macos/zazzle-macos-universal.tar.gz
            src/macos/zazzle-macos-universal.tar.gz.sha256
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(zazzle-macos-universal.tar.gz zazzle-macos-universal.tar.gz.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --notes "" "${files[@]}"
          fi
      - name: Publish to icelander.net
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab026008f5aa2bef2dca4cfccd0f70ef
        run: |
          put="$GITHUB_WORKSPACE/release/r2-put.sh"
          for dir in "$TAG" alpha; do
            bash "$put" "zazzle/$dir/zazzle-macos-universal.tar.gz" zazzle-macos-universal.tar.gz application/gzip
            bash "$put" "zazzle/$dir/zazzle-macos-universal.tar.gz.sha256" zazzle-macos-universal.tar.gz.sha256 \
              "text/plain; charset=utf-8"
          done
          for f in dist/languages/*; do
            bash "$put" "zazzle/$TAG/languages/macos-universal/${f##*/}" "$f" application/octet-stream
          done
          for f in dist/tools/*; do
            bash "$put" "zazzle/$TAG/tools/macos-universal/${f##*/}" "$f" application/octet-stream
          done

  # The zazzle-alpha formula in the zazzcat/homebrew-z tap, with its bottle on the pre-release.
  alpha-homebrew:
    needs: [version, alpha]
    env:
      TAG: ${{ needs.version.outputs.alpha_tag }}
      FORMULA: zazzle-alpha
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: zazzcat/homebrew-z
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v8
        with:
          name: zazzle-alpha-macos-universal
          path: dist
      - name: Build the bottle and add it to the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf dist/zazzle-macos-universal.tar.gz -C dist
          bash release/bottle.sh "$TAG" dist bottles
          gh release upload "$TAG" bottles/*.bottle.tar.gz --clobber
      - name: Write and push the formula
        run: |
          sha=$(cut -d' ' -f1 dist/zazzle-macos-universal.tar.gz.sha256)
          bash release/formula.sh "$TAG" "$sha" tap/Formula bottles
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "zazzle-alpha $TAG"
          git push origin HEAD

  # The macOS release is five jobs so independent work runs side by side: the tests, the language modules (with the
  # PGO profile trained on them), the C# indexer and one build per CPU type, then one job that assembles, signs and
  # publishes. Rust jobs restore a build cache (keyed before the version is stamped, so it survives version changes).

  # Language modules (release/README.md): one universal dylib per grammar (daemon links none). They are signed
  # before their hashes go into the manifest that daemon embeds, so a signed daemon loads them under library validation.
  # The PGO profile for daemon's C code (tree-sitter) is trained on arm64 with them and used for both CPU types.
  # The JIT tools (ai-agent, which daemon downloads for `zazzle agent llm|prompt`) are built, signed and listed here
  # too, so their manifest is ready for the daemon builds.
  macos-languages:
    needs: [version, alpha]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.stable == 'true' && contains(fromJSON('["success","skipped"]'), needs.alpha.result) }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
          key: release-languages
      - name: Stamp the version
        working-directory: .
        run: bash release/set-version.sh "${{ needs.version.outputs.version }}"
      - name: Build the language modules
        run: bash ../../release/language-modules.sh dist/languages aarch64-apple-darwin x86_64-apple-darwin
      - name: Sign the language modules
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          cd dist/languages
          ../../../../release/sign-and-notarize.sh . *.dylib
      - name: Write the language module manifest
        run: bash ../../release/language-modules.sh --manifest dist/languages
      - name: Build, sign and list the JIT tools
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          bash ../../release/tools.sh dist/tools aarch64-apple-darwin x86_64-apple-darwin
          (cd dist/tools && ../../../../release/sign-and-notarize.sh . ai-agent)
          bash ../../release/tools.sh --manifest dist/tools
      - name: Train the PGO profile for daemon's C code
        env:
          PGO_LANGUAGES: dist/languages
        run: |
          sh ../../release/pgo.sh > pgo.env
          mkdir -p dist/pgo
          cp target/pgo/daemon.profdata dist/pgo/
      - uses: actions/upload-artifact@v7
        with:
          name: macos-languages
          path: |
            src/macos/dist/languages
            src/macos/dist/tools
            src/macos/dist/pgo

  # The workspace tests, run beside the builds instead of before them.
  macos-test:
    needs: [version, alpha]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.stable == 'true' && contains(fromJSON('["success","skipped"]'), needs.alpha.result) }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
          key: release-test
      - name: Stamp the version
        working-directory: .
        run: bash release/set-version.sh "${{ needs.version.outputs.version }}"
      - run: cargo build --release -p zazz-script-runner --locked
      - run: cargo test --workspace --locked

  # One build of the workspace per CPU type (ai-agent aside), with the language and tool manifests and PGO profile from macos-languages.
  macos-build:
    needs: [version, macos-languages]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled') }}
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
          key: release-${{ matrix.target }}
      - name: Stamp the version
        working-directory: .
        run: bash release/set-version.sh "${{ needs.version.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: macos-languages
          path: src/macos/dist
      - name: Build
        env:
          CC: clang
          ZAZZLE_LANGUAGES_MANIFEST: ${{ github.workspace }}/src/macos/dist/languages/manifest
          ZAZZLE_TOOLS_MANIFEST: ${{ github.workspace }}/src/macos/dist/tools/manifest
        run: |
          export CFLAGS="-fprofile-instr-use=$PWD/dist/pgo/daemon.profdata -Wno-profile-instr-unprofiled -Wno-profile-instr-out-of-date"
          cargo build --workspace --exclude ai-agent --release --locked --target "${{ matrix.target }}"
          mkdir -p bin
          for b in daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor; do
            cp "target/${{ matrix.target }}/release/$b" bin/
          done
          tar -C bin -cf bin.tar .
      - uses: actions/upload-artifact@v7
        with:
          name: macos-bin-${{ matrix.target }}
          path: src/macos/bin.tar

  # The indexer is a self-contained single file per CPU type (not universal); the formula expands the matching one.
  macos-indexer:
    needs: [version, alpha]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.stable == 'true' && contains(fromJSON('["success","skipped"]'), needs.alpha.result) }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/macos/csharp-indexer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test and build for both CPU types
        run: |
          dotnet test tests
          mkdir -p gz
          for pair in arm64:osx-arm64 x64:osx-x64; do
            dotnet publish src -c Release -r "${pair#*:}" -o "out/${pair#*:}" -p:Version="${{ needs.version.outputs.version }}"
            gzip -9 -n -c "out/${pair#*:}/csharp-indexer" > "gz/csharp-indexer-${pair%%:*}.gz"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: macos-indexer
          path: src/macos/csharp-indexer/gz

  # Assemble the universal binaries, build the arm64 zazzle invoker, sign, package and publish.
  macos:
    needs: [version, macos-languages, macos-test, macos-build, macos-indexer]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled') }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src/macos
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: src/macos/artifacts
      - name: Make universal binaries
        run: |
          mkdir -p dist bin/aarch64-apple-darwin bin/x86_64-apple-darwin
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -C "bin/$t" -xf "artifacts/macos-bin-$t/bin.tar"
          done
          for bin in daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor; do
            lipo -create -output "dist/$bin" "bin/aarch64-apple-darwin/$bin" "bin/x86_64-apple-darwin/$bin"
          done
          cp -R artifacts/macos-languages/languages dist/languages
          cp -R artifacts/macos-languages/tools dist/tools
          cp artifacts/macos-indexer/*.gz dist/
      - name: Build and smoke test the zazzle invoker (arm64 only; Intel Macs use zazzle daemon mcp or zazzle daemon run)
        env:
          DAEMON: bin/aarch64-apple-darwin/daemon
        run: |
          make -C zazzle
          make -C zazzle unit
          sh zazzle/test/smoke.sh
          cp zazzle/build/zazzle dist/zazzle
      # cyberspace-generator is built in cyberspace-explorer; ship the release pinned in release/cyberspace-generator.version.
      - name: Add cyberspace-generator
        run: |
          bash ../../release/fetch-cyberspace-generator.sh cg aarch64-apple-darwin x86_64-apple-darwin
          lipo -create -output dist/cyberspace-generator cg/cyberspace-generator-aarch64-apple-darwin cg/cyberspace-generator-x86_64-apple-darwin
          ./dist/cyberspace-generator --version
      # Optional Developer ID signature and Apple notarization (release/README.md): skipped with a
      # warning without the Apple secrets, unless the repository variable REQUIRE_SIGNING is "true".
      - name: Sign and notarize
        env:
          REQUIRE_SIGNING: ${{ vars.REQUIRE_SIGNING == 'true' }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: ../../release/sign-and-notarize.sh dist zazzle daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor cyberspace-generator
      - name: Package
        run: |
          bash ../../release/pack.sh dist zazzle-macos-universal.tar.gz zazzle daemon zazz-script-runner fix-network free-disk-space git-tools git-tools-commit ai-agent-rules git-tools-commit-message-editor cyberspace-generator csharp-indexer-arm64.gz csharp-indexer-x64.gz
          shasum -a 256 zazzle-macos-universal.tar.gz > zazzle-macos-universal.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: zazzle-macos-universal
          path: |
            src/macos/zazzle-macos-universal.tar.gz
            src/macos/zazzle-macos-universal.tar.gz.sha256
      - name: Publish release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        # Uploads to the release when it already exists, so a re-run of this job can finish publishing.
        run: |
          files=(zazzle-macos-universal.tar.gz zazzle-macos-universal.tar.gz.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${files[@]}"
          else
            gh release create "$TAG" --notes "" "${files[@]}"
          fi
      - name: Publish to icelander.net
        if: needs.version.outputs.publish == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab026008f5aa2bef2dca4cfccd0f70ef
        run: |
          put="$GITHUB_WORKSPACE/release/r2-put.sh"
          for dir in "$TAG" latest; do
            bash "$put" "zazzle/$dir/zazzle-macos-universal.tar.gz" zazzle-macos-universal.tar.gz application/gzip
            bash "$put" "zazzle/$dir/zazzle-macos-universal.tar.gz.sha256" zazzle-macos-universal.tar.gz.sha256 \
              "text/plain; charset=utf-8"
          done
          # The modules and tools belong to this release's daemon only, so they go under the tag, not latest.
          for f in dist/languages/*; do
            bash "$put" "zazzle/$TAG/languages/macos-universal/${f##*/}" "$f" application/octet-stream
          done
          for f in dist/tools/*; do
            bash "$put" "zazzle/$TAG/tools/macos-universal/${f##*/}" "$f" application/octet-stream
          done

  # Linux tarballs build beside the macOS jobs; only publishing them (linux-publish) waits for the GitHub release.
  linux:
    needs: [version, alpha]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.stable == 'true' && contains(fromJSON('["success","skipped"]'), needs.alpha.result) }}
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, rid: linux-x64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, rid: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
          key: release-linux-${{ matrix.arch }}
      - name: Stamp the version
        run: bash release/set-version.sh "${{ needs.version.outputs.version }}"
      - name: Test daemon
        working-directory: src/macos
        run: |
          cargo build --release -p zazz-script-runner --locked
          cargo test -p daemon --locked
      - name: Install clang, LLVM and clang's profile runtime for PGO
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          v=$(clang --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -1)
          sudo apt-get install -y -qq "libclang-rt-$v-dev"
      - name: Build the language modules and their manifest
        working-directory: src/macos
        run: |
          bash ../../release/language-modules.sh dist/languages
          bash ../../release/language-modules.sh --manifest dist/languages
      - name: Build the JIT tools and their manifest
        working-directory: src/macos
        run: |
          bash ../../release/tools.sh dist/tools
          bash ../../release/tools.sh --manifest dist/tools
      - name: Train the PGO profile for daemon's C code
        env:
          PGO_LANGUAGES: src/macos/dist/languages
        run: sh release/pgo.sh >> "$GITHUB_ENV"
      - name: Build daemon with the profile
        working-directory: src/macos
        env:
          CC: clang
          CFLAGS: ${{ env.PGO_CFLAGS }}
          ZAZZLE_LANGUAGES_MANIFEST: ${{ github.workspace }}/src/macos/dist/languages/manifest
          ZAZZLE_TOOLS_MANIFEST: ${{ github.workspace }}/src/macos/dist/tools/manifest
        run: cargo build --release -p daemon --locked
      - name: Build and smoke test the zazzle invoker
        working-directory: src/macos/zazzle
        run: |
          make
          make unit
          sh test/smoke.sh
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build the C# indexer
        working-directory: src/macos/csharp-indexer
        run: |
          dotnet test tests
          dotnet publish src -c Release -r ${{ matrix.rid }} -o out -p:Version="${{ needs.version.outputs.version }}"
      - name: Package
        run: |
          mkdir -p dist
          cp src/macos/target/release/daemon src/macos/target/release/zazz-script-runner src/macos/zazzle/build/zazzle src/macos/csharp-indexer/out/csharp-indexer dist/
          bash release/fetch-cyberspace-generator.sh cg ${{ matrix.arch }}-unknown-linux-musl
          cp cg/cyberspace-generator-${{ matrix.arch }}-unknown-linux-musl dist/cyberspace-generator
          bash release/pack.sh dist zazzle-linux-${{ matrix.arch }}.tar.gz zazzle daemon zazz-script-runner csharp-indexer cyberspace-generator
          sha256sum zazzle-linux-${{ matrix.arch }}.tar.gz > zazzle-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: zazzle-linux-${{ matrix.arch }}
          path: |
            zazzle-linux-${{ matrix.arch }}.tar.gz
            zazzle-linux-${{ matrix.arch }}.tar.gz.sha256
            src/macos/dist/languages
            src/macos/dist/tools
  # Attach the Linux tarballs to the release the macos job created, and upload them and their language modules and tools.
  linux-publish:
    needs: [version, macos, linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled') && needs.version.outputs.publish == 'true' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    steps:
      # The checkout comes first because it would clean away the downloaded files; it provides r2-put.sh.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: zazzle-linux-${{ matrix.arch }}
      - name: Attach to the GitHub release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: >
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
          zazzle-linux-${{ matrix.arch }}.tar.gz zazzle-linux-${{ matrix.arch }}.tar.gz.sha256
      - name: Publish to icelander.net
        if: needs.version.outputs.publish == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ab026008f5aa2bef2dca4cfccd0f70ef
        run: |
          put="$GITHUB_WORKSPACE/release/r2-put.sh"
          for dir in "$TAG" latest; do
            bash "$put" "zazzle/$dir/zazzle-linux-${{ matrix.arch }}.tar.gz" zazzle-linux-${{ matrix.arch }}.tar.gz application/gzip
            bash "$put" "zazzle/$dir/zazzle-linux-${{ matrix.arch }}.tar.gz.sha256" zazzle-linux-${{ matrix.arch }}.tar.gz.sha256 \
              "text/plain; charset=utf-8"
          done
          for f in src/macos/dist/languages/*; do
            bash "$put" "zazzle/$TAG/languages/linux-${{ matrix.arch }}/${f##*/}" "$f" application/octet-stream
          done
          for f in src/macos/dist/tools/*; do
            bash "$put" "zazzle/$TAG/tools/linux-${{ matrix.arch }}/${f##*/}" "$f" application/octet-stream
          done


  # Write the zazzle formula for this release into the zazzcat/homebrew-z tap. HOMEBREW_TAP_TOKEN is a fine-grained
  # token with "Contents: read and write" on that repository only; GITHUB_TOKEN cannot push to another account.
  homebrew:
    needs: [version, macos]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled') && needs.version.outputs.publish == 'true' }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: zazzcat/homebrew-z
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - uses: actions/download-artifact@v8
        with:
          name: zazzle-macos-universal
          path: dist
      # Bottles let brew pour the binaries without its build-from-source checks (Command Line Tools).
      - name: Build the bottle and add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf dist/zazzle-macos-universal.tar.gz -C dist
          bash release/bottle.sh "$TAG" dist bottles
          gh release upload "$TAG" bottles/*.bottle.tar.gz --clobber
      - name: Write and push the formula
        run: |
          sha=$(cut -d' ' -f1 dist/zazzle-macos-universal.tar.gz.sha256)
          bash release/formula.sh "$TAG" "$sha" tap/Formula bottles
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "zazzle $TAG"
          git push origin HEAD
