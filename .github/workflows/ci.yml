# Lint, test and build the Rust tools on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: macos/rust

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - run: cargo test --workspace --locked
      - name: Name the failing afod test (single-threaded rerun)
        if: failure()
        run: cargo test -p afod --locked -- --test-threads=1 2>&1 | tail -25
      - run: cargo build --workspace --release --locked
      - name: Smoke test CLIs
        run: |
          ./target/release/afs --help
          ./target/release/afs call '{"op":"stat","path":"."}'
          ./target/release/fix-network --help
          ./target/release/free-disk-space --help
          ./target/release/free-disk-space clean caches

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --workspace --locked

  afo-c:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p afod --locked
      - name: Build, unit test and smoke test the C invoker
        working-directory: macos/c/afo
        run: make && make unit && sh test/smoke.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - name: agent-fs needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p agent-fs --branch --locked --fail-under-lines 95 --lcov --output-path lcov.info
          awk -F'[:,]' '/^BRDA/ { total++; if ($5 != "0" && $5 != "-") hit++ }
            END { printf "branch coverage %.2f%% (%d/%d)\n", 100*hit/total, hit, total; if (100*hit/total < 95) exit 1 }' lcov.info
      - name: Rust branch coverage (at least 95%)
        run: sh afod/coverage.sh 95
      - name: C invoker branch coverage (at least 95%)
        working-directory: macos/c/afo
        run: make coverage
