# Lint, test and build the Rust tools on Linux (macOS is built by the release workflow only: its minutes cost ten times Linux's).
name: CI

# Only code changes start CI; docs and agent notes do not. (workflow_dispatch ignores the filters.)
on:
  push:
    branches: [main]
    paths: ["src/**", "release/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "release/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: src/macos

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
      - run: cargo fmt --all --check
      - name: Release scripts (shellcheck; signing against stand-in Apple tools; Homebrew formulas and bottles; version numbers; language modules; JIT tools; R2 upload retries)
        working-directory: release
        run: |
          shellcheck sign-and-notarize.sh sign-and-notarize.test.sh formula.sh formula.test.sh bottle.sh pack.sh pgo.sh version.sh version.test.sh set-version.sh fetch-cyberspace-generator.sh fetch-cyberspace-generator.test.sh language-modules.sh language-modules.test.sh tools.sh tools.test.sh r2-put.sh r2-put.test.sh
          bash sign-and-notarize.test.sh
          bash formula.test.sh
          bash version.test.sh
          bash fetch-cyberspace-generator.test.sh
          bash language-modules.test.sh
          bash tools.test.sh
          bash r2-put.test.sh
      - run: cargo clippy --workspace --all-targets --locked

  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # zazz scripts compile to WASM; the zazz tests build real scripts.
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
      - run: cargo build --release -p zazz-script-runner --locked
      # One zazz test at a time with a hard limit, so a test that hangs under the macOS sandbox shows up by name.
      - name: zazz tests one at a time (macOS, 15 minute limit)
        if: runner.os == 'macOS'
        run: |
          perl -e 'alarm 900; exec @ARGV' cargo test -p daemon --locked zazz:: -- --test-threads=1
      # Runs even when the macOS zazz step failed, so failures in the other crates show up in the same run.
      - run: cargo test --workspace --locked
        if: always()
      - name: Name the failing daemon test (single-threaded rerun)
        if: failure()
        run: cargo test -p daemon --locked -- --test-threads=1 2>&1 | tail -25
      - run: cargo build --workspace --release --locked
      - name: Smoke test CLIs
        run: |
          ./target/release/fix-network --help
          ./target/release/free-disk-space --help
          ./target/release/free-disk-space clean caches
          ./target/release/git-tools --version
          ./target/release/git-tools help commit
          ./target/release/ai-agent-rules --version
          ./target/release/ai-agent-rules get-rules . --name-only

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      # zazz-script-runner embeds wasmtime, which needs a recent Rust; it has its own rust-version.
      - run: cargo check --workspace --exclude zazz-script-runner --locked

  zazzle-c:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p daemon --locked
      - name: Build, unit test and smoke test the C invoker
        working-directory: src/macos/zazzle
        run: make && make unit && sh test/smoke.sh

  # Branch coverage needs nightly (cargo llvm-cov --branch); shell-tools, fix-network, git-tools and ai-agent-rules must keep 95% of branches and lines.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/macos
      - name: shell-tools needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p shell-tools --branch --locked --fail-under-lines 95 --lcov --output-path lcov.info
          awk -F'[:,]' '/^BRDA/ { total++; if ($5 != "0" && $5 != "-") hit++ }
            END { printf "branch coverage %.2f%% (%d/%d)\n", 100*hit/total, hit, total; if (100*hit/total < 95) exit 1 }' lcov.info
      - name: fix-network needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p fix-network --branch --locked --summary-only --json --output-path cov.json --fail-under-lines 95
          jq -e '.data[0].totals.branches.percent >= 95' cov.json \
            || { echo "::error::fix-network branch coverage is below 95%"; exit 1; }
      - name: git-tools needs 95% line and branch coverage (includes the pseudo-terminal end-to-end tests)
        run: |
          cargo llvm-cov -p git-tools --branch --locked --fail-under-lines 95 --lcov --output-path lcov-git-tools.info
          awk -F'[:,]' '/^BRDA/ { total++; if ($5 != "0" && $5 != "-") hit++ }
            END { printf "branch coverage %.2f%% (%d/%d)\n", 100*hit/total, hit, total; if (100*hit/total < 95) exit 1 }' lcov-git-tools.info
      - name: ai-agent-rules needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p ai-agent-rules --branch --locked --fail-under-lines 95 --lcov --output-path lcov-ai-agent-rules.info
          awk -F'[:,]' '/^BRDA/ { total++; if ($5 != "0" && $5 != "-") hit++ }
            END { printf "branch coverage %.2f%% (%d/%d)\n", 100*hit/total, hit, total; if (100*hit/total < 95) exit 1 }' lcov-ai-agent-rules.info
      - name: Rust branch coverage (at least 95%)
        run: sh daemon/coverage.sh 95
      - name: zazz crates branch coverage (at least 95%)
        run: |
          sh daemon/coverage.sh 95 zazz-script-packaging
          sh daemon/coverage.sh 95 zazz-script-engine
          sh daemon/coverage.sh 95 zazz-script-runner
      - name: C invoker branch coverage (at least 95%)
        working-directory: src/macos/zazzle
        run: make coverage

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/macos/csharp-indexer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests
      - run: dotnet publish src -c Release -o out
      - name: Smoke test server and daemon
        env:
          ZAZZLE_INDEXER_STATE_DIR: ${{ runner.temp }}/csharp-indexer-state
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"overview","arguments":{}}}' | ./out/csharp-indexer serve --root repo=../../.. | tee smoke.txt
          grep -q '"tools":\[\]' smoke.txt
          grep -q '"isError":false' smoke.txt
          ./out/csharp-indexer report
          pkill -f "csharp-indexer daemon" || true

  dotnet-minifier:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/macos/csharp-minifier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests
      - run: dotnet publish src -c Release -o out
      - name: Smoke test test splitting and renaming on a copy of the indexer
        run: |
          plain="$RUNNER_TEMP/indexer-plain"
          cp -R ../csharp-indexer "$plain"
          git -C "$plain" init -q
          ./out/csharp-minifier --root "$plain" --split-tests
          ./out/csharp-minifier --root "$plain" --check --split-tests
          dotnet build "$plain/tests"
          ./out/csharp-minifier --root "$plain" --list-identifiers | sed 's/^    Daemon:$/    Daemon => Server:/' > "$RUNNER_TEMP/rename.txt"
          ./out/csharp-minifier --root "$plain" --rename "$RUNNER_TEMP/rename.txt"
          test -f "$plain/src/Server/Daemon.cs"
          dotnet test "$plain/tests"
