# Lint, test and build the Rust tools on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: macos/rust

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - run: cargo fmt --all --check
      - name: Release scripts (shellcheck; signing against stand-in Apple tools; Homebrew formulas and bottles)
        working-directory: macos/release
        run: |
          shellcheck sign-and-notarize.sh sign-and-notarize.test.sh formula.sh formula.test.sh bottle.sh pgo.sh
          bash sign-and-notarize.test.sh
          bash formula.test.sh
      - run: cargo clippy --workspace --all-targets --locked

  test:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # zazz scripts compile to WASM; the zazz tests build real scripts.
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - run: cargo build --release -p zazz-worker --locked
      # One zazz test at a time with a hard limit, so a test that hangs under the macOS sandbox shows up by name.
      - name: zazz tests one at a time (macOS, 15 minute limit)
        if: runner.os == 'macOS'
        run: perl -e 'alarm 900; exec @ARGV' cargo test -p zazzled --locked zazz:: -- --test-threads=1
      - run: cargo test --workspace --locked
      - name: Name the failing zazzled test (single-threaded rerun)
        if: failure()
        run: cargo test -p zazzled --locked -- --test-threads=1 2>&1 | tail -25
      - run: cargo build --workspace --release --locked
      - name: Smoke test CLIs
        run: |
          ./target/release/afs --help
          ./target/release/afs call '{"op":"stat","path":"."}'
          ./target/release/fix-network --help
          ./target/release/free-disk-space --help
          ./target/release/free-disk-space clean caches

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85
      # zazz-worker embeds wasmtime, which needs a recent Rust; it has its own rust-version.
      - run: cargo check --workspace --exclude zazz-worker --locked

  zazzle-c:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p zazzled --locked
      - name: Build, unit test and smoke test the C invoker
        working-directory: macos/c/zazzle
        run: make && make unit && sh test/smoke.sh

  # Branch coverage needs nightly (cargo llvm-cov --branch); agent-fs and fix-network must keep 95% of branches and lines.
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: macos/rust
      - name: agent-fs needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p agent-fs --branch --locked --fail-under-lines 95 --lcov --output-path lcov.info
          awk -F'[:,]' '/^BRDA/ { total++; if ($5 != "0" && $5 != "-") hit++ }
            END { printf "branch coverage %.2f%% (%d/%d)\n", 100*hit/total, hit, total; if (100*hit/total < 95) exit 1 }' lcov.info
      - name: fix-network needs 95% line and branch coverage
        run: |
          cargo llvm-cov -p fix-network --branch --locked --summary-only --json --output-path cov.json --fail-under-lines 95
          jq -e '.data[0].totals.branches.percent >= 95' cov.json \
            || { echo "::error::fix-network branch coverage is below 95%"; exit 1; }
      - name: Rust branch coverage (at least 95%)
        run: sh zazzled/coverage.sh 95
      - name: zazz crates branch coverage (at least 95%)
        run: |
          sh zazzled/coverage.sh 95 zazz-format
          sh zazzled/coverage.sh 95 zazz-sdk
          sh zazzled/coverage.sh 95 zazz-worker
      - name: C invoker branch coverage (at least 95%)
        working-directory: macos/c/zazzle
        run: make coverage

  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: macos/dotnet/zazzle-csharp-indexer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests
      - run: dotnet publish src -c Release -o out
      - name: Smoke test server and daemon
        env:
          ZAZZLE_INDEXER_STATE_DIR: ${{ runner.temp }}/zazzle-csharp-indexer-state
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"overview","arguments":{}}}' | ./out/zazzle-csharp-indexer serve --root repo=../../.. | tee smoke.txt
          grep -q '"isError":false' smoke.txt
          ./out/zazzle-csharp-indexer report
          pkill -f "zazzle-csharp-indexer daemon" || true
