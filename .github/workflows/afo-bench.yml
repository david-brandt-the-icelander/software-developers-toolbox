# Run the afo phase 0 latency benchmark on macOS and Linux runners, on demand and on changes to the C invoker.
name: afo bench

on:
  pull_request:
    paths: ["macos/c/afo/**", ".github/workflows/afo-bench.yml"]
  workflow_dispatch:
    inputs:
      runs:
        description: Spawns per row
        default: "3000"

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, variant: libsystem }
          - { os: macos-latest, variant: static }
          - { os: ubuntu-latest, variant: native }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build daemon
        working-directory: macos/rust
        run: cargo build --release -p afod
      - name: Build invoker (${{ matrix.variant }})
        working-directory: macos/c/afo
        run: make DARWIN_VARIANT=${{ matrix.variant }}
      - name: Smoke test
        working-directory: macos/c/afo
        run: sh test/smoke.sh
      - name: Diagnose invoker
        if: always() && matrix.variant == 'static'
        working-directory: macos/c/afo
        run: |
          otool -hv build/exit0 || true
          otool -l build/exit0 | grep -E "^Load command|cmd |segname|entry|pc |vmaddr|dylinker|platform|minos" || true
          codesign -vvv build/exit0 || true
          ./build/exit0 || echo "exit0 status $?"
          sudo log show --last 1m --predicate 'eventMessage CONTAINS "exit0"' --style compact | tail -15 || true
      - name: Probe Mach-O link configurations
        if: always() && matrix.variant == 'static'
        working-directory: macos/c/afo
        run: sh test/probe_darwin.sh
      - name: Benchmark
        if: success()
        working-directory: macos/c/afo
        run: sh bench/run.sh ${{ inputs.runs || '3000' }}
