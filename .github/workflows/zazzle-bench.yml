# Run the zazzle latency and refs benchmarks on macOS and Linux runners, on demand and on changes to the C invoker or the daemon.
name: zazzle bench

on:
  pull_request:
    paths: ["macos/c/zazzle/**", "macos/rust/zazzled/**", "macos/rust/zazzle-lang/**", "macos/release/pgo.sh", "macos/release/language-modules.sh", ".github/workflows/zazzle-bench.yml"]
  workflow_dispatch:
    inputs:
      runs:
        description: Spawns per row
        default: "3000"

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    # zazzled links no grammar: every build here embeds the manifest of the outline modules built below and loads them from there.
    env:
      ZAZZLED_LANGUAGES_MANIFEST: ${{ github.workspace }}/macos/rust/dist/languages/manifest
      ZAZZLE_LANGUAGES_DIR: ${{ github.workspace }}/macos/rust/dist/languages
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the language modules outlines use
        working-directory: macos/rust
        env:
          LANGUAGES: rust python c javascript typescript tsx csharp
        run: |
          bash ../release/language-modules.sh dist/languages
          bash ../release/language-modules.sh --manifest dist/languages
      - name: Build daemon
        working-directory: macos/rust
        run: cargo build --release -p zazzled
      - name: Build invoker
        working-directory: macos/c/zazzle
        run: make
      - name: Smoke test
        working-directory: macos/c/zazzle
        run: sh test/smoke.sh
      - name: Benchmark
        working-directory: macos/c/zazzle
        run: sh bench/run.sh ${{ inputs.runs || '3000' }}
      - name: Benchmark refs over the crate sources (cold, then warm)
        working-directory: macos/c/zazzle
        run: sh bench/refs.sh 20 100
      - name: Install clang, LLVM and clang's profile runtime for PGO
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          v=$(clang --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -1)
          sudo apt-get install -y -qq "libclang-rt-$v-dev"
      - name: Train the PGO profile (same script as the release)
        env:
          PGO_LANGUAGES: macos/rust/dist/languages
        run: sh macos/release/pgo.sh >> "$GITHUB_ENV"
      - name: Build zazzled with the profile
        working-directory: macos/rust
        env:
          CC: clang
          CFLAGS: ${{ env.PGO_CFLAGS }}
        run: cargo build --release -p zazzled --locked --target-dir target/pgo-use
      - name: Benchmark refs with PGO (trained on the same crate sources, so an upper bound)
        working-directory: macos/c/zazzle
        env:
          ZAZZLED: ../../rust/target/pgo-use/release/zazzled
        run: sh bench/refs.sh 20 100
