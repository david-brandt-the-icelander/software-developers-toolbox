# Run the zazzle latency and refs benchmarks on macOS and Linux runners, on demand and on changes to the C invoker or the daemon.
name: zazzle bench

on:
  pull_request:
    paths: ["src/macos/zazzle/**", "src/macos/daemon/**", "src/macos/language-modules/**", "release/pgo.sh", "release/language-modules.sh", ".github/workflows/zazzle-bench.yml"]
  workflow_dispatch:
    inputs:
      runs:
        description: Spawns per row
        default: "3000"

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ten times Linux's: macOS runs only when started by hand.
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["macos-latest","ubuntu-24.04"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    # daemon links no grammar: every build here embeds the manifest of the outline modules built below and loads them from there.
    env:
      ZAZZLE_LANGUAGES_MANIFEST: ${{ github.workspace }}/src/macos/dist/languages/manifest
      ZAZZLE_LANGUAGES_DIR: ${{ github.workspace }}/src/macos/dist/languages
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the language modules outlines use
        working-directory: src/macos
        env:
          LANGUAGES: rust python c javascript typescript tsx csharp
        run: |
          bash ../../release/language-modules.sh dist/languages
          bash ../../release/language-modules.sh --manifest dist/languages
      - name: Build daemon
        working-directory: src/macos
        run: cargo build --release -p daemon
      - name: Build invoker
        working-directory: src/macos/zazzle
        run: make
      - name: Smoke test
        working-directory: src/macos/zazzle
        run: sh test/smoke.sh
      - name: Benchmark
        working-directory: src/macos/zazzle
        run: sh bench/run.sh ${{ inputs.runs || '3000' }}
      - name: Benchmark refs over the crate sources (cold, then warm)
        working-directory: src/macos/zazzle
        run: sh bench/refs.sh 20 100
      - name: Install clang, LLVM and clang's profile runtime for PGO
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm
          v=$(clang --version | sed -n 's/.*clang version \([0-9][0-9]*\).*/\1/p' | head -1)
          sudo apt-get install -y -qq "libclang-rt-$v-dev"
      - name: Train the PGO profile (same script as the release)
        env:
          PGO_LANGUAGES: src/macos/dist/languages
        run: sh release/pgo.sh >> "$GITHUB_ENV"
      - name: Build daemon with the profile
        working-directory: src/macos
        env:
          CC: clang
          CFLAGS: ${{ env.PGO_CFLAGS }}
        run: cargo build --release -p daemon --locked --target-dir target/pgo-use
      - name: Benchmark refs with PGO (trained on the same crate sources, so an upper bound)
        working-directory: src/macos/zazzle
        env:
          DAEMON: ../target/pgo-use/release/daemon
        run: sh bench/refs.sh 20 100
