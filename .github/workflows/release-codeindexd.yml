# Publish single-file codeindexd binaries to a GitHub release on codeindexd-v* tags.
name: Release codeindexd

on:
  push:
    tags: ["codeindexd-v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: macos/dotnet/codeindexd

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: ubuntu-latest, rid: linux-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests
      - run: dotnet publish src -c Release -r ${{ matrix.rid }} -o out
      - name: Package
        run: |
          tar -C out -czf codeindexd-${{ matrix.rid }}.tar.gz codeindexd
          shasum -a 256 codeindexd-${{ matrix.rid }}.tar.gz > codeindexd-${{ matrix.rid }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: codeindexd-${{ matrix.rid }}
          path: macos/dotnet/codeindexd/codeindexd-${{ matrix.rid }}.tar.gz*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "codeindexd single-file binaries (unsigned)."
