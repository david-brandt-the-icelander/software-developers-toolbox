[package]
name = "shell-tools"
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "shell_tools"
path = "src/lib.rs"

# Each dependency has one reason; std covers everything else.
[dependencies]
# Content hashes for etags.
blake3 = "1"
# O_NOATIME, posix_fadvise and mkfifo (tests).
libc = "0.2"
# Fast newline scans for line slicing.
memchr = "2"
# The search pattern, compiled here and scanned by the daemon.
regex = "1"
# Request parsing.
serde = { version = "1", features = ["derive"] }
# Requests and replies.
serde_json = "1"
# Line diffs for changed files.
similar = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
