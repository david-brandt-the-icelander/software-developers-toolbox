[package]
name = "zazz-sdk"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The SDK has no dependencies on purpose: zazzled compiles it with plain rustc for every script.
[lib]
name = "zazz"
path = "src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
