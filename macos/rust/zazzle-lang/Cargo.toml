[package]
name = "zazzle-lang"
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One tree-sitter grammar as a shared library that zazzled downloads and loads; build it with exactly one language feature (macos/release/language-modules.sh builds them all).
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
bash = ["dep:tree-sitter-bash"]
dart = ["dep:tree-sitter-dart"]
go = ["dep:tree-sitter-go"]
java = ["dep:tree-sitter-java"]
cpp = ["dep:tree-sitter-cpp"]
lua = ["dep:tree-sitter-lua"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
swift = ["dep:tree-sitter-swift"]
perl = ["dep:ts-parser-perl"]
php = ["dep:tree-sitter-php"]
ruby = ["dep:tree-sitter-ruby"]
scala = ["dep:tree-sitter-scala"]
elixir = ["dep:tree-sitter-elixir"]
haskell = ["dep:tree-sitter-haskell"]
ocaml = ["dep:tree-sitter-ocaml"]
fsharp = ["dep:tree-sitter-fsharp"]
clojure = ["dep:tree-sitter-clojure-orchard"]
erlang = ["dep:tree-sitter-erlang"]
r = ["dep:tree-sitter-r"]
julia = ["dep:tree-sitter-julia"]
zig = ["dep:tree-sitter-zig"]
objc = ["dep:tree-sitter-objc"]
groovy = ["dep:tree-sitter-groovy"]
powershell = ["dep:tree-sitter-powershell"]
vb = ["dep:tree-sitter-vb-dotnet"]

[dependencies]
# The type of the function each grammar crate exports.
tree-sitter-language = "0.1"
# The bash grammar, for the bash module.
tree-sitter-bash = { version = "0.25", optional = true }
# The dart grammar, for the dart module.
tree-sitter-dart = { version = "0.3", optional = true }
# The go grammar, for the go module.
tree-sitter-go = { version = "0.23", optional = true }
# The java grammar, for the java module.
tree-sitter-java = { version = "0.23", optional = true }
# The cpp grammar, for the cpp module.
tree-sitter-cpp = { version = "0.23", optional = true }
# The lua grammar, for the lua module.
tree-sitter-lua = { version = "0.5", optional = true }
# The kotlin grammar, for the kotlin module.
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
# The swift grammar, for the swift module.
tree-sitter-swift = { version = "0.7", optional = true }
# The perl grammar, for the perl module.
ts-parser-perl = { version = "2.0", optional = true }
# The php grammar, for the php module.
tree-sitter-php = { version = "0.25", optional = true }
# The ruby grammar, for the ruby module.
tree-sitter-ruby = { version = "0.23", optional = true }
# The scala grammar, for the scala module.
tree-sitter-scala = { version = "0.26", optional = true }
# The elixir grammar, for the elixir module.
tree-sitter-elixir = { version = "0.3", optional = true }
# The haskell grammar, for the haskell module.
tree-sitter-haskell = { version = "0.24", optional = true }
# The ocaml grammar, for the ocaml module.
tree-sitter-ocaml = { version = "0.26", optional = true }
# The fsharp grammar, for the fsharp module.
tree-sitter-fsharp = { version = "0.3", optional = true }
# The clojure grammar, for the clojure module.
tree-sitter-clojure-orchard = { version = "0.2", optional = true }
# The erlang grammar, for the erlang module.
tree-sitter-erlang = { version = "0.21", optional = true }
# The r grammar, for the r module.
tree-sitter-r = { version = "1.3", optional = true }
# The julia grammar, for the julia module.
tree-sitter-julia = { version = "0.23", optional = true }
# The zig grammar, for the zig module.
tree-sitter-zig = { version = "1.1", optional = true }
# The objc grammar, for the objc module.
tree-sitter-objc = { version = "3.0", optional = true }
# The groovy grammar, for the groovy module.
tree-sitter-groovy = { version = "0.1", optional = true }
# The powershell grammar, for the powershell module.
tree-sitter-powershell = { version = "0.26", optional = true }
# The vb grammar, for the vb module.
tree-sitter-vb-dotnet = { version = "0.1", optional = true }
