[package]
name = "zazzled"
version = "0.0.0-dev"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "zazzled"
path = "src/lib.rs"

[[bin]]
name = "zazzled"
path = "src/main.rs"

# Each dependency has one reason; std covers everything else.
[dependencies]
# Content hashing: NEON-accelerated and fast enough to hash every file lazily.
blake3 = "1"
# gitignore-aware directory walking.
ignore = "0.4"
# Raw socket calls, SCM_RIGHTS, getpeereid and launchd activation.
libc = "0.2"
# Fast newline and substring scans (NEON on Apple Silicon).
memchr = "2"
# Regular-expression search; std has none.
regex = "1"
# MCP JSON-RPC messages.
serde_json = "1"
# Exact syntax trees for symbol outlines.
tree-sitter = "0.25"
# C grammar for outlines.
tree-sitter-c = "0.24"
# C# grammar for outlines and read --symbol.
tree-sitter-c-sharp = "0.23"
# Dart grammar for the terse view.
tree-sitter-dart = "0.3"
# Go grammar for the terse view.
tree-sitter-go = "0.23"
# Java grammar for the terse view.
tree-sitter-java = "0.23"
# C++ grammar for the terse view.
tree-sitter-cpp = "0.23"
# Kotlin grammar for the terse view.
tree-sitter-kotlin-ng = "1.1"
# Swift grammar for the terse view.
tree-sitter-swift = "0.7"
# PHP grammar for the terse view.
tree-sitter-php = "0.25"
# Ruby grammar for the terse view.
tree-sitter-ruby = "0.23"
# Scala grammar for the terse view.
tree-sitter-scala = "0.26"
# JavaScript grammar for outlines.
tree-sitter-javascript = "0.23"
# Python grammar for outlines.
tree-sitter-python = "0.23"
# Rust grammar for outlines.
tree-sitter-rust = "0.23"
# TypeScript and TSX grammars for outlines.
tree-sitter-typescript = "0.23"
# HTTPS client for the MCP proxy: blocking like the rest of the daemon, rustls with the OS trust store.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
